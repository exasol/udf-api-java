sources:
  - type: "maven"
    path: "pom.xml"
    modules:
      - maven_central
      - integration_tests
      - udf_coverage
build:
  runnerOs: ubuntu-24.04
  exasolDbVersions:
    - "2025.2.1"
    - "2025.1.10"
    - "7.1.30"
  workflows:
    - name: ci-build.yml
      stepCustomizations:
        - action: INSERT_AFTER
          job: matrix-build
          stepId: enable-testcontainer-reuse
          content:
            name: Fix VM Crash in UDFs
            id: fix-vm-crash
            run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
